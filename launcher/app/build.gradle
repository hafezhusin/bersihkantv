plugins {
    id 'com.android.application'
}

// Release signing is opt-in: without launcher/keystore.properties a local build keeps the debug key,
// so the default build-and-install flow is unchanged. A published artifact must be release-signed;
// `-PrequireReleaseSigning=true` turns the missing key into a build error instead of a debug APK.
// See docs/specs/release-artifact.md. The properties file and the keystore are never committed.
def keystoreProperties = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseKey = keystoreFile.exists()
// Checked before the release task runs, not while the script is evaluated: failing here keeps the
// message the person sees the actual problem instead of AGP's secondary "compileSdkVersion" error.
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseKey && providers.gradleProperty('requireReleaseSigning')
            .getOrElse('false').toBoolean() && graph.allTasks.any { it.name == 'assembleRelease' }) {
        throw new GradleException('requireReleaseSigning=true needs launcher/keystore.properties with ' +
                'storeFile, storePassword, keyAlias and keyPassword')
    }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB from source: the debug key keeps installs simple. With
            // keystore.properties present this becomes the release key, which is what a published
            // artifact uses; tools/release_manifest.py refuses a debug-signed APK by default.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
