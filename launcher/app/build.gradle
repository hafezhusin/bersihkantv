plugins {
    id 'com.android.application'
}

// The companion bridge is opt-in at every layer. Without -PcompanionBridge=true the provider class is
// not compiled and the provider is not in the merged manifest, so the default release build is byte-for
// -byte the same feature set as before this change.
def companionBridge = providers.gradleProperty('companionBridge')
        .map { it == 'true' }.getOrElse(false)
// Theme schedules ship with the companion bridge, but can be excluded from a bridge build that must
// stay read/write only: -PcompanionSchedules=false drops the capability and the evaluator wiring.
def companionSchedules = companionBridge && providers.gradleProperty('companionSchedules')
        .map { it != 'false' }.getOrElse(true)
// Provider credentials are a separate optional feature: -PcompanionCredentials=false keeps the
// bridge writable while advertising no credential methods at all.
def companionCredentials = companionBridge && providers.gradleProperty('companionCredentials')
        .map { it != 'false' }.getOrElse(true)
def generatedCompanionManifest = layout.buildDirectory.file('generated/companion/AndroidManifest.xml')

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '2.5'
        buildConfigField 'boolean', 'COMPANION_BRIDGE', "${companionBridge}"
        buildConfigField 'boolean', 'COMPANION_SCHEDULES', "${companionSchedules}"
        buildConfigField 'boolean', 'COMPANION_CREDENTIALS', "${companionCredentials}"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // org.json is part of Android but not of a plain JVM test runtime.
    testImplementation 'org.json:json:20240303'
}

if (companionBridge) {
    android.sourceSets.main.java.srcDirs += 'src/companion/java'
    android.sourceSets.main.manifest.srcFile generatedCompanionManifest
}

def generateCompanionManifest = tasks.register('generateCompanionManifest') {
    description = 'Adds the opt-in companion provider to the merged manifest.'
    def base = file('src/main/AndroidManifest.xml')
    def output = generatedCompanionManifest
    inputs.file(base)
    outputs.file(output)
    doLast {
        def provider = '''
        <!-- Opt-in companion protocol v1; see docs/specs/companion-protocol.md. -->
        <provider android:name=".CompanionProvider"
            android:authorities="com.gathin.tvhome.companion"
            android:exported="true"
            android:grantUriPermissions="false" />
'''
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = base.text.replace('</application>', provider + '    </application>')
    }
}

if (companionBridge) {
    tasks.named('preBuild') { dependsOn generateCompanionManifest }
}
